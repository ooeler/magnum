version: 2
updates:
  # npm: Sicherheitsupdates sofort, normale Updates jeden Montag gesammelt in einem PR.
  # Kleine Updates (Minor/Patch) werden nach grünen Tests gemergt und automatisch deployt (auto-merge.yml).
  # Grosse Versionssprünge (Major) kommen als eigener PR und bleiben offen, bis jemand sie prüft.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      npm-klein:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-sicherheit:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
