# Jede Änderung kommt über einen eigenen Branch + Pull Request.
# Sind alle Tests und Sicherheitsprüfungen grün, wird automatisch gemergt und – je nach Branch – ein Release erstellt und deployt:
#   feature/…                  → Minor-Release (z. B. v1.1.0)
#   fix/…, Dependabot npm       → Patch-Release (z. B. v1.0.2)  (Sicherheits-, Minor- und Patch-Updates; Major bleibt offen)
#   ci/…, docs/…, Dependabot Actions → nur mergen, kein Release (Major-Actions-Updates bleiben offen)
# Visueller Vergleich (visuell.yml) läuft bei jedem Pull Request. Er blockiert nur Abhängigkeits-Updates
# (dependabot/*, fix/abhaengigkeiten-*): Weichen dort Bilder ab, wird nicht gemergt. Sonst nur ein Hinweis.
# Entwürfe (Draft) und Pull Requests aus Forks werden nie automatisch gemergt.
name: Auto-Merge & Release

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  # Entwürfe in eigener Gruppe: ein übersprungener Entwurfs-Lauf darf den echten Lauf nicht abbrechen
  group: auto-merge-${{ github.event.pull_request.number }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/ci.yml

  codeql:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/codeql.yml
    permissions:
      security-events: write
      contents: read
      actions: read

  visuell:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/visuell.yml
    with:
      basis: ${{ github.event.pull_request.base.sha }}

  merge:
    # Tests, Semgrep, npm audit und CodeQL müssen grün sein. Visuell zählt nur bei Abhängigkeits-Updates
    # (Schritt «Art der Änderung bestimmen»), darum läuft der Job auch, wenn visuell rot ist.
    needs: [test, codeql, visuell]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.codeql.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      TITLE: ${{ github.event.pull_request.title }}
    steps:
      - id: meta
        if: github.actor == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3

      - name: Art der Änderung bestimmen
        id: kind
        env:
          ECO: ${{ steps.meta.outputs.package-ecosystem }}
          UPD: ${{ steps.meta.outputs.update-type }}
          VISUELL: ${{ needs.visuell.result }}
        run: |
          bump=none; merge=true
          case "$BRANCH" in
            feature/*) bump=minor ;;
            fix/*)     bump=patch ;;
            dependabot/*)
              if [ "$UPD" = "version-update:semver-major" ]; then merge=false
              elif [ "$ECO" = "npm_and_yarn" ]; then bump=patch; fi ;;
          esac
          # Abhängigkeits-Updates nur mergen, wenn der visuelle Vergleich grün ist (Major bleibt ohnehin offen)
          case "$BRANCH" in
            dependabot/*|fix/abhaengigkeiten-*)
              if [ "$VISUELL" != "success" ]; then
                echo "::error::Visueller Vergleich: $VISUELL. Abhängigkeits-Update wird nicht gemergt, Unterschiede im Artefakt «visuell-unterschiede»."
                merge=false; blockiert=1
              fi ;;
          esac
          echo "bump=$bump" >> "$GITHUB_OUTPUT"; echo "merge=$merge" >> "$GITHUB_OUTPUT"
          echo "Branch $BRANCH → merge=$merge, release=$bump, visuell=$VISUELL"
          # Rot statt still offen: so ist im Pull Request sichtbar, dass das Update blockiert ist
          if [ -n "${blockiert:-}" ]; then exit 1; fi

      - name: Mergen
        if: steps.kind.outputs.merge == 'true'
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch

      - name: Release erstellen und deployen
        if: steps.kind.outputs.merge == 'true' && steps.kind.outputs.bump != 'none'
        env:
          BUMP: ${{ steps.kind.outputs.bump }}
        run: |
          last=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          IFS=. read -r ma mi pa <<< "${last#v}"; ma=${ma:-1}; mi=${mi:-0}; pa=${pa:-0}
          if [ "$BUMP" = "minor" ]; then mi=$((mi+1)); pa=0; else pa=$((pa+1)); fi
          tag="v$ma.$mi.$pa"; echo "Neue Version: $tag (vorher $last)"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target main --title "Magnum ${tag#v}" --generate-notes
          # Ein mit GITHUB_TOKEN erstelltes Release startet keine Workflows → Deployment explizit anstossen.
          # Ist der gemergte Stand auf main Datei fuer Datei identisch mit dem hier getesteten (gleicher Git-Tree),
          # muss das Release die Tests nicht nochmals laufen lassen. Ist main inzwischen weitergelaufen
          # (anderer PR dazwischen gemergt), weicht der Tree ab und das Release testet wie bisher voll.
          getestet=""
          merged=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq '.mergeCommit.oid' || true)
          baum_main=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$merged" --jq '.tree.sha' 2>/dev/null || true)
          baum_test=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq '.tree.sha' 2>/dev/null || true)
          if [ -n "$baum_test" ] && [ "$baum_main" = "$baum_test" ]; then
            getestet="$baum_test"; echo "main = getesteter Stand ($baum_test) → Release ohne zweiten Testlauf"
          else
            echo "main weicht vom getesteten Stand ab → Release testet nochmals"
          fi
          # Von main aus: GitHub Pages nimmt nur Deployments von main an, keine von Tags.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f grund="$TITLE ($tag, #$PR)" \
            -f getestet="$getestet" -f lauf="$GITHUB_RUN_ID"
