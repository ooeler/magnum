# Deployment. Läuft automatisch nach jedem gemergten Pull Request (siehe auto-merge.yml)
# oder manuell über "Run workflow" auf main (GitHub Pages nimmt nur Deployments von main an).
# Reihenfolge: Tests → Backup → Wartungsseite an → Neon-Dienste → Datenbank (setup.sql + Migrationen) → Sicherheitsprüfung → Funktionstest → App (GitHub Pages) → Wartungsseite aus.
# Bricht ein Schritt ab, geht nichts Neues live; das Backup erlaubt jederzeit ein Rollback (README: Rollback).
name: Release

on:
  workflow_dispatch:
    inputs:
      grund:
        description: Grund für das Deployment
        required: false
        default: manuell

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  backend:
    needs: test
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      CRON_SECRET: ${{ secrets.MAGNUM_CRON_SECRET }}
      APP_URL: ${{ vars.APP_URL }}
      PROJECT: ${{ vars.NEON_PROJECT_ID }}
    steps:
      - name: Secrets vorhanden?
        run: |
          miss=""
          [ -n "$NEON_API_KEY" ] || miss="$miss NEON_API_KEY"
          [ -n "$CRON_SECRET" ] || miss="$miss MAGNUM_CRON_SECRET"
          [ -n "$PROJECT" ] || miss="$miss NEON_PROJECT_ID(Variable)"
          [ -n "$APP_URL" ] || miss="$miss APP_URL(Variable)"
          if [ -n "$miss" ]; then echo "::error::Fehlt in GitHub → Settings → Secrets and variables → Actions:$miss"; exit 1; fi
          if ! [[ "$GITHUB_REF_NAME" =~ ^[A-Za-z0-9._/-]+$ ]]; then echo "::error::Ungültiger Tag-Name"; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm ci
      - name: Neon-CLI und Verbindung
        run: |
          npm i -g neon@8.15.1  # gleiche Version wie lokal getestet
          neon link --project-id "$PROJECT" -y --no-env-pull
          neon connection-string main > "$RUNNER_TEMP/db"  # nur als Datei: Die Adresse enthält das Passwort

      - name: Backup vor dem Deployment
        # direkt per SQL – beim allerersten Release gibt es die Funktion noch nicht
        run: |
          psql "$(cat "$RUNNER_TEMP/db")" -v ON_ERROR_STOP=1 -q -c "do \$\$ begin if to_regprocedure('public.snapshot_club(text)') is not null then
               perform public.snapshot_club('vor Release ${GITHUB_REF_NAME}');
             end if; end \$\$"
          echo "Backup vor Release ${GITHUB_REF_NAME} erstellt"

      - name: Wartungsseite einschalten
        # offene Apps zeigen "Update wird eingespielt" und speichern nichts, bis das Update live ist
        run: |
          psql "$(cat "$RUNNER_TEMP/db")" -v ON_ERROR_STOP=1 -q -c "do \$\$ begin if to_regclass('public.app_status') is not null then
               update public.app_status set maintenance = true, since = now() where id = 'main';
             end if; end \$\$"
          echo "Wartungsseite an"

      - name: Neon-Dienste (Login, Data API, Fotos, Function) mit neon deploy
        run: |
          printf 'APP_URL=%s\nCRON_SECRET=%s\n' "$APP_URL" "$CRON_SECRET" > .env.deploy
          neon deploy --env .env.deploy --allow-protected --update-existing -y
          rm -f .env.deploy .env.local
          neon neon-auth domain add "$(node -p 'new URL(process.env.APP_URL).origin')" || true

      - name: Datenbank einrichten (setup.sql ist mehrfach ausführbar) und Migrationen
        run: |
          psql "$(cat "$RUNNER_TEMP/db")" -v ON_ERROR_STOP=1 -q -f db/setup.sql > /dev/null
          echo "✓ db/setup.sql"
          psql "$(cat "$RUNNER_TEMP/db")" -v ON_ERROR_STOP=1 -q -c "create table if not exists public.schema_migrations (name text primary key, applied_at timestamptz not null default now()); alter table public.schema_migrations enable row level security;"
          for f in $(ls db/migrations/*.sql 2>/dev/null | sort); do
            n=$(basename "$f")
            c=$(psql "$(cat "$RUNNER_TEMP/db")" -At -c "select count(*) from public.schema_migrations where name = '$n'")
            if [ "$c" = "1" ]; then echo "✓ $n (bereits angewendet)"; continue; fi
            echo "→ $n"
            psql "$(cat "$RUNNER_TEMP/db")" -v ON_ERROR_STOP=1 -q -f "$f"
            psql "$(cat "$RUNNER_TEMP/db")" -q -c "insert into public.schema_migrations (name) values ('$n')"
          done
          neon data-api refresh-schema

      - name: Sicherheitsprüfung Datenbank
        run: |
          # Ohne Login darf keine Funktion ausführbar sein, jede Tabelle braucht Row Level Security
          # und der Trigger user_gate muss Konten ohne Einladung abweisen
          f=$(psql "$(cat "$RUNNER_TEMP/db")" -At -c "select coalesce(string_agg(p.proname, ', '), '') from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'public' and p.prorettype <> 'trigger'::regtype and has_function_privilege('anonymous', p.oid, 'EXECUTE')")
          t=$(psql "$(cat "$RUNNER_TEMP/db")" -At -c "select coalesce(string_agg(c.relname, ', '), '') from pg_class c join pg_namespace n on n.oid = c.relnamespace
                 where n.nspname = 'public' and c.relkind = 'r' and not c.relrowsecurity")
          g=$(psql "$(cat "$RUNNER_TEMP/db")" -At -c "select count(*) from pg_trigger where tgname = 'user_gate' and tgenabled <> 'D'")
          [ -z "$f" ] || { echo "::error::Ohne Login ausführbare Funktionen: $f"; exit 1; }
          [ -z "$t" ] || { echo "::error::Tabellen ohne Row Level Security: $t"; exit 1; }
          [ "$g" = "1" ] || { echo "::error::Trigger user_gate fehlt: Konten ohne Einladung wären möglich"; exit 1; }
          echo "Funktionsrechte, Row Level Security und Einladungspflicht in Ordnung"

      - name: Funktionstest Datenbank (ohne bleibende Änderung)
        run: |
          # sichert in der echten DB und macht es sofort rückgängig; jeder andere Fehler stoppt das Release
          psql "$(cat "$RUNNER_TEMP/db")" -v ON_ERROR_STOP=1 -q -c "do \$\$ begin begin perform public.snapshot_club('Funktionstest'); raise exception using errcode = 'P0099';
             exception when sqlstate 'P0099' then null; end; end \$\$"
          echo "snapshot_club funktioniert"

  pages:
    needs: backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm ci --omit=dev
      - name: config.js aus den Repository-Variablen schreiben
        env:
          NEON_DATA_API_URL: ${{ vars.NEON_DATA_API_URL }}
          MAGNUM_API_URL: ${{ vars.MAGNUM_API_URL }}
        run: |
          node -e '
            const e = process.env;
            if (!e.NEON_DATA_API_URL || !e.MAGNUM_API_URL) { console.error("Variablen NEON_DATA_API_URL / MAGNUM_API_URL fehlen"); process.exit(1); }
            const c = { data: e.NEON_DATA_API_URL, api: e.MAGNUM_API_URL };
            require("fs").writeFileSync("app/config.js", "window.MG_CONFIG = " + JSON.stringify(c, null, 2) + ";\n");'
      - name: Neue Cache-Version, damit Handys das Update laden
        run: sed -i "s/var V = \"mg-v1\"/var V = \"mg-${GITHUB_SHA::8}\"/" app/sw.js
      - name: App bauen (Content-Security-Policy)
        env:
          NEON_HOSTS: ${{ vars.NEON_HOSTS }}
        run: node scripts/build.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # Läuft immer (auch wenn ein Schritt fehlschlägt), damit die App nie in der Wartung hängen bleibt.
  # Die Apps laden danach automatisch neu und holen die neue Version.
  wartung-aus:
    needs: [backend, pages]
    if: always() && needs.backend.result != 'skipped'
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      PROJECT: ${{ vars.NEON_PROJECT_ID }}
      PAGES: ${{ needs.pages.result }}
    steps:
      - name: Wartungsseite ausschalten
        run: |
          # GitHub Pages braucht nach dem Deployment einen Moment, bis die neue Version überall ausgeliefert wird
          [ "$PAGES" = "success" ] && sleep 30
          npm i -g neon@8.15.1
          psql "$(neon connection-string main --project-id "$PROJECT")" -v ON_ERROR_STOP=1 -q -c "do \$\$ begin if to_regclass('public.app_status') is not null then
               update public.app_status set maintenance = false, since = null where id = 'main';
             end if; end \$\$"
          echo "Wartungsseite aus"
