<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1416">
<title>Magnum</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Magnum">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1B1416;--card:#251C1F;--deep:#160F12;--ln:#3A2C30;--ln2:#4A3A3E;--tx:#F3EBDD;--mu:#C9B8A6;--mu2:#A8988A;--ac:#E8B95A;--wine:#8E2A3A;--teal:#7FC4B8;--orange:#F08A5D;--lila:#B79CE0;--pink:#E79AA8;--hf:Fraunces,Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Inter,system-ui,-apple-system,sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body.nonav{padding-bottom:0}
a{color:var(--ac)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
[hidden]{display:none!important}
header{padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--ln);background:var(--bg);position:sticky;top:0;z-index:4}
header .sub{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--mu);font-weight:600}
header h1{margin:2px 0 0;font:900 30px/1 var(--hf);letter-spacing:-.5px}
.hello{font-size:13px;color:var(--mu);margin-top:4px}
main{padding:16px 14px 24px;display:flex;flex-direction:column;gap:14px;max-width:640px;margin:0 auto}
h2{margin:6px 2px 0;font:700 22px var(--hf)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.gold{border-color:var(--ac);background:#2B1F23}
.card.wine{background:var(--wine);border-color:var(--wine)}
.lbl{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--mu);font-weight:600}
.big{font:900 26px/1.05 var(--hf)}
.mid{font:900 20px/1.15 var(--hf)}
.mu{color:var(--mu)}.sm{font-size:12px}.xs{font-size:11px}.b{font-weight:700}
.row{display:flex;align-items:center;gap:10px}.sb{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1 1 auto;min-width:0}
.col{display:flex;flex-direction:column;gap:6px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--bg);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.tile b{font:900 20px var(--hf)}.tile span{font-size:11px;color:var(--mu)}
.bar{height:8px;border-radius:4px;background:var(--ln);overflow:hidden}.bar>i{display:block;height:100%;background:var(--ac);border-radius:4px}
.bar.teal>i{background:var(--teal)}
.segs{display:flex;gap:4px}.segs i{flex:1 1 0;height:7px;border-radius:3px;background:var(--ln)}.segs i.on{background:var(--ac)}
.btn{min-height:48px;border-radius:14px;border:0;background:var(--ac);color:#1B1416;font-weight:800;font-size:15px;padding:0 16px}
.btn.teal{background:var(--teal)}.btn.pink{background:var(--pink)}.btn.lila{background:var(--lila)}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--ln2);font-weight:700}
.btn.line{background:transparent;color:var(--tx);border:1px solid var(--ac);font-weight:700}
.btn.dash{background:transparent;color:var(--ac);border:1px dashed var(--ac);font-weight:700;min-height:42px}
.btn.link{background:transparent;color:var(--ac);min-height:40px;padding:0 6px}
.pill{min-height:40px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:700;background:transparent;color:var(--tx);border:1px solid var(--ln2)}
.pill.on{background:var(--ac);color:#1B1416;border-color:var(--ac)}
.pill.out{background:var(--wine);color:#fff;border-color:var(--wine)}
.pill.sm{min-height:36px;padding:0 12px;font-size:12px}
.wa{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--tx)}
.wa svg{color:#25D366;flex:0 0 auto}
a.pill.wa{align-self:flex-start}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--bg);color:var(--mu);border:1px solid var(--ln);display:inline-block}
.chip.ja{background:var(--teal);color:#1B1416;border-color:var(--teal)}.chip.nein{background:var(--wine);color:#fff;border-color:var(--wine)}
.chip.guest{background:#3A2A20;color:var(--tx);border-color:#5A4430}.chip.v{background:var(--teal);color:#1B1416;border-color:var(--teal);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
input.t,select.t,textarea.t{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--ln2);background:var(--bg);color:var(--tx);padding:0 12px;font-size:16px}
textarea.t{padding:10px 12px;min-height:90px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--mu)}
.file{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.av{width:44px;height:44px;flex:0 0 44px;border-radius:50%;background:var(--wine);display:flex;align-items:center;justify-content:center;font:900 18px var(--hf);color:var(--tx)}
.av.s{width:36px;height:36px;flex-basis:36px;font-size:14px}.av.l{width:64px;height:64px;flex-basis:64px;font-size:26px}.av.drv{background:#2C4A5A}
.ev{display:flex;gap:14px}
.dt{width:58px;flex:0 0 58px;border-radius:12px;background:var(--wine);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0;align-self:flex-start}
.dt b{font:900 24px/1 var(--hf)}.dt span{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#F6D9DE}
.lst{display:flex;flex-direction:column}.lst>*{border-top:1px solid var(--ln);padding:10px 0}.lst>*:first-child{border-top:0;padding-top:0}
.rk{width:30px;font:900 18px var(--hf);color:var(--mu2)}.rk.g1{color:#E8B95A}.rk.g2{color:#CFCFD4}.rk.g3{color:#D08A55}
li.me{background:#3A2A20;border-radius:10px;padding-left:6px!important;padding-right:6px!important}
ol{list-style:none;margin:0;padding:0}
.mem{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:7px;text-align:left;color:var(--tx)}
.nick{color:var(--ac);font-weight:700;font-size:13px}
.trip{background:var(--card);border:1px solid var(--ln);border-radius:16px;overflow:hidden;text-align:left;padding:0;color:var(--tx);display:block;width:100%}
.band{min-height:88px;display:flex;align-items:flex-end;justify-content:space-between;padding:12px 16px;gap:8px}
.band b{font:900 22px var(--hf);color:#FFF8EE}.band span{font-size:12px;font-weight:700;background:var(--bg);color:var(--tx);padding:4px 10px;border-radius:999px;white-space:nowrap}
.ph{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.ph>*{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bg);display:block}
.ph img,.cimg img{width:100%;height:100%;object-fit:cover;display:block}
.kgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kc{background:var(--card);border:2px solid var(--c,var(--ac));border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;min-height:220px;color:var(--tx)}
.kc.lock{border-style:dashed;border-color:var(--ln2);background:#1F1719;color:var(--mu)}
.kc .r{font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--c,var(--ac))}
.cimg{flex:1 1 auto;border-radius:10px;background:var(--bg);min-height:96px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cimg b{font:900 40px var(--hf);color:var(--c,var(--ac))}
.coll{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;width:100%;height:100%}.coll>*{min-height:46px;background:#3A2C30;overflow:hidden}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--ln);background:var(--deep);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{background:none;border:0;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mu2);font-size:11px;font-weight:600}
nav button i{width:22px;height:4px;border-radius:2px;background:transparent}
nav button.on{color:var(--ac)}nav button.on i{background:var(--ac)}
#ov{position:fixed;inset:0;background:var(--bg);z-index:8;overflow-y:auto}
#ov .top{padding:calc(14px + env(safe-area-inset-top,0px)) 16px 16px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--ln)}
.back{width:44px;height:44px;border-radius:50%;border:1px solid var(--ln);background:var(--card);display:flex;align-items:center;justify-content:center;align-self:flex-start}
#sh{position:fixed;inset:0;background:rgba(10,6,8,.85);z-index:9;display:flex;align-items:flex-end;justify-content:center}
#sh section{width:100%;max-width:640px;max-height:92vh;overflow-y:auto;background:var(--card);border-radius:24px 24px 0 0;padding:24px 20px calc(30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;border-top:2px solid var(--teal)}
.virt{min-height:64px;padding:12px 16px;border-radius:16px;border:0;background:var(--teal);color:#1B1416;font-size:15px;font-weight:700;text-align:left;line-height:1.35;display:flex;flex-direction:column;gap:2px}
#toast{position:fixed;left:16px;right:16px;top:calc(96px + env(safe-area-inset-top,0px));max-width:600px;margin:0 auto;background:var(--ac);color:#1B1416;border-radius:14px;padding:12px 16px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.45);z-index:20}
#party{position:fixed;inset:0;background:rgba(60,12,24,.94);z-index:15;overflow:hidden}
#party .gx{position:absolute;left:0;display:block;animation:mgX var(--dx) linear var(--d) infinite alternate}
#party .gy{display:block;animation:mgY var(--dy) var(--d2) infinite}
#party .pf{position:absolute;left:0;right:0;bottom:60px;display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 24px;text-align:center}
#party .prost{font:900 48px var(--hf);color:var(--ac);animation:mgP 1.6s ease-in-out infinite}
@keyframes mgX{0%{transform:translateX(-30px)}100%{transform:translateX(calc(100vw - 20px))}}
@keyframes mgY{0%{transform:translateY(0) rotate(-8deg);animation-timing-function:cubic-bezier(.2,.7,.4,1)}50%{transform:translateY(-180px) rotate(10deg);animation-timing-function:cubic-bezier(.6,0,.8,.3)}100%{transform:translateY(0) rotate(-8deg)}}
@keyframes mgP{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){#party .gx,#party .gy,#party .prost{animation:none}}
.gl{position:relative;display:inline-block}
.gl .hat{position:absolute;top:-11px;left:4px;transform:rotate(-8deg)}
.fx,#snow{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:30}
.fx span{position:absolute;left:0;font-size:38px;line-height:1;animation:mgFly 7s linear both}
.fx.rv span{animation-name:mgFlyR}
.fx svg{display:block}
#snow i{position:absolute;top:-10px;border-radius:50%;background:#fff;opacity:.7;animation:mgSnow linear both}
@keyframes mgFly{0%{transform:translateX(-70px) rotate(-12deg)}50%{transform:translate(50vw,-30px) rotate(10deg)}100%{transform:translateX(calc(100vw + 70px)) rotate(-12deg)}}
@keyframes mgFlyR{0%{transform:translateX(calc(100vw + 70px)) rotate(12deg)}50%{transform:translate(50vw,-30px) rotate(-10deg)}100%{transform:translateX(-70px) rotate(12deg)}}
@keyframes mgSnow{to{transform:translateY(105vh)}}
@media (prefers-reduced-motion:reduce){.fx,#snow{display:none}}
.laden{display:flex;flex-direction:column;align-items:center;gap:12px;padding:32px 0;text-align:center;color:var(--mu)}
#app>.laden{min-height:100vh;justify-content:center}
.ladeglas .rand{fill:none;stroke:#F4ECE0;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ladeglas .wein{fill:#8E1F36;transform:translateY(46px);animation:mgFill 2s ease-in-out infinite}
@keyframes mgFill{0%{transform:translateY(46px)}70%,90%{transform:translateY(8px)}100%{transform:translateY(46px)}}
.laden.update .wein{animation:mgVoll 180s cubic-bezier(.1,.6,.3,1) forwards}
@keyframes mgVoll{from{transform:translateY(46px)}to{transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.ladeglas .wein{animation:none;transform:translateY(8px)}}
.star{width:44px;height:44px;border:0;background:transparent;padding:0;display:inline-flex;align-items:center;justify-content:center}
.stars{display:flex;gap:2px}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px}.bars>div{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.bars i{display:block;width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--wine)}.bars .last i{background:var(--ac)}
.auth{min-height:100vh;padding:calc(60px + env(safe-area-inset-top,0px)) 24px 40px;display:flex;flex-direction:column;gap:18px;max-width:480px;margin:0 auto}
.err{color:var(--orange);font-size:13px}
.empty{color:var(--mu);font-size:13px;text-align:center;padding:8px}
details summary{cursor:pointer;font-weight:700;list-style:none}details summary::-webkit-details-marker{display:none}
.ok{color:var(--teal)}
.mono{font-family:ui-monospace,Menlo,monospace;letter-spacing:.5px}
.kasse{display:flex;gap:4px;flex-wrap:wrap}.kasse i{width:14px;height:28px;border-radius:4px 4px 3px 3px;background:var(--teal)}
</style>
</head><body>
<div id="app"><div class="laden"><svg class="ladeglas" width="64" height="96" viewBox="0 0 64 96" role="img" aria-label="Lädt"><defs><clipPath id="kelch"><path d="M14 6C10 34 20 50 32 50S54 34 50 6Z"/></clipPath></defs><g clip-path="url(#kelch)"><rect class="wein" x="0" y="6" width="64" height="46"/></g><path class="rand" d="M14 6C10 34 20 50 32 50S54 34 50 6ZM32 50V86M20 88H44"/></svg></div></div>
<div id="toast" role="status" hidden></div>

<script src="client.js"></script>
<script src="quittung.js"></script>
<script src="leaflet.js"></script>
<script>
"use strict";
// ═══════════════════════════════════════════════════════════════════════
//  Magnum – App des Magnum Clubs: Anlässe, Reisen, Mitglieder, Sammelkarten, Statistik.
//  Gamification (Punkte, Streak, Ränge), Zusammenhalt (Club-Ziel, Prost-Wand), Geselligkeit.
//  Daten: Neon (Row Level Security). Abstimmungen laufen über Datenbank-Funktionen.
// ═══════════════════════════════════════════════════════════════════════
var C = window.MG_CONFIG || {}, sb = null, ME = null, PRF = null, PREV = null, MAINT = false, READY = false;
var TABLES = ["settings", "profiles", "events", "rsvps", "magnums", "magnum_guests", "rides", "ride_passengers", "trips",
  "trip_participants", "trip_photos", "proposals", "ballots", "posts", "post_prosts", "cards", "drinks", "sayings", "card_members", "gaeste", "karte_der_woche",
  "saying_prosts", "restaurants", "restaurant_visits", "restaurant_ratings", "feedback", "admin_log"];
var D = {}; TABLES.forEach(function (t) { D[t] = [] });
var TAB = lsGet("mg_tab") || "termine", OV = null, SH = null, UI = {}, AUTH = { mode: "login" }, INVITE = null, INVLIST = null, NEWLINK = null, BUSY = false;
var URLS = {}, WANT = {}, CACHE = null, CH = null;

function lsGet(k) { try { return localStorage.getItem(k) } catch (e) { return null } }
function lsSet(k, v) { try { localStorage.setItem(k, v) } catch (e) {} }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c] }) }
function now() { return Date.now() }
function uid() { return ME && ME.id }
function localDay(iso) { var d = new Date(iso); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") }
function today() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") }
function pr(id) { return D.profiles.find(function (p) { return p.id == id }) || null }
function nm(id) { var p = pr(id); return p ? (p.display_name || "Mitglied") : "–" }
function first(id) { return nm(id).split(" ")[0] }
function ini(id) { return (nm(id).trim().charAt(0) || "?").toUpperCase() }
function deviceText(p) { return p.device == "android" ? "Android" : "iPhone" }
var ICON_ANDROID = '<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" fill="#7FC4B8"><path d="M6 10h12v7.5A1.5 1.5 0 0 1 16.5 19H7.5A1.5 1.5 0 0 1 6 17.5zM6 9a6 6 0 0 1 12 0zM8.6 3.2l1.2 2.1M15.4 3.2l-1.2 2.1" stroke="#7FC4B8" stroke-width="1.4"/><circle cx="9.5" cy="6.8" r=".8" fill="#1B1013"/><circle cx="14.5" cy="6.8" r=".8" fill="#1B1013"/></svg>';
var ICON_IPHONE = '<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" fill="#D9D1C7"><path d="M16.4 12.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.2-2.8.9-3.5.9s-1.8-.8-3-.8C6.9 7.4 5.4 8.3 4.6 9.8c-1.7 2.9-.4 7.2 1.2 9.6.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8s1.9.8 3.1.8c1.3 0 2.1-1.2 2.9-2.4.9-1.3 1.3-2.6 1.3-2.7-.1 0-2.6-1-2.8-4.1zM14.2 5.6c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1 .1 2.1-.6 2.8-1.4z"/></svg>';
function geraetIcon(p) { return p.device == "android" ? ICON_ANDROID : ICON_IPHONE }
// Sichtweise: Ein Admin kann die App so ansehen, wie ein Mitglied sie sieht. Die Rechte in der Datenbank bleiben.
var ALS_MITGLIED = lsGet("mg_als_mitglied") == "1";
function echterAdmin() { return !!(PRF && PRF.is_admin) }
function isAdmin() { return echterAdmin() && !ALS_MITGLIED }
function S() { return D.settings[0] || { goal_title: "Club-Ziel", goal_target: 30, magnum_price: 45 } }
function byDate(a, b) { return new Date(a.starts_at) - new Date(b.starts_at) }
var MON = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
function fDate(iso, time) {
  var d = new Date(iso); if (isNaN(d)) return "";
  var s = d.toLocaleDateString("de-CH", { weekday: "short", day: "numeric", month: "short" });
  return time ? s + " · " + d.toLocaleTimeString("de-CH", { hour: "2-digit", minute: "2-digit" }) : s;
}
var MONATE = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
function magnumName(iso) { return MONATE[new Date(iso).getMonth()] + "-Magnum" }
function lokalZeit(iso) { var d = new Date(iso); return localDay(iso) + "T" + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0") }
function fDay(isoDate) { if (!isoDate) return ""; var d = new Date(isoDate + "T12:00:00"); return d.getDate() + ". " + MON[d.getMonth()] + " " + d.getFullYear() }
function fMonYear(isoDate) { if (!isoDate) return ""; var d = new Date(isoDate + "T12:00:00"); return MON[d.getMonth()] + " " + d.getFullYear() }
function chf(n) { return "CHF " + (Math.round(Number(n) * 100) / 100).toLocaleString("de-CH", { minimumFractionDigits: 0, maximumFractionDigits: 2 }) }

// ───────────── Kurze Meldung ─────────────
var TT = null;
function toast(t) { var e = document.getElementById("toast"); e.textContent = t; e.hidden = false; clearTimeout(TT); TT = setTimeout(function () { e.hidden = true }, 3500) }

// ═════════════ Spielregeln (Punkte, Streak, Ränge, Trinkfestigkeit) ═════════════

// Trinkfestigkeit: Ø Einheiten pro Abend aus den fotografierten Getränken

}

// Duell des Monats: Anwesenheit in Prozent, weil die beiden Lager nicht gleich gross sind. Zählt nur, wer wirklich dabei war.
function duellMonat(m) {
  var E = pastEvents().filter(function (e) { return localDay(e.starts_at).slice(0, 7) == m });
  if (!E.length) return null;
  var quote = function (g) {
    var L = D.profiles.filter(function (p) { return p.device == g }), n = 0;
    L.forEach(function (p) { E.forEach(function (e) { if (rsvp(e.id, p.id) == "in") n++ }) });
    return Math.round(100 * n / (L.length * E.length));
  };
  return { android: quote("android"), iphone: quote("iphone") };
}
function duell() {
  if (!D.profiles.some(function (p) { return p.device == "android" }) || !D.profiles.some(function (p) { return p.device == "iphone" })) return "";
  var d = new Date(), jetzt = duellMonat(today().slice(0, 7)), vor = duellMonat(localDay(new Date(d.getFullYear(), d.getMonth() - 1, 15).toISOString()).slice(0, 7));
  var zeile = function (n, q) { return '<div class="col" style="gap:4px"><div class="row sb sm"><span class="b">' + n + '</span><span data-test="duell-' + n.toLowerCase() + '">' + q + ' %</span></div><div class="bar"><i style="width:' + q + '%"></i></div></div>' };
  var h = '<section class="card" aria-label="Duell des Monats"><span class="lbl">Duell des Monats · Android gegen iPhone</span>';
  h += jetzt ? zeile("Android", jetzt.android) + zeile("iPhone", jetzt.iphone) + '<span class="sm mu">' + (jetzt.android == jetzt.iphone ? "Unentschieden." : (jetzt.android > jetzt.iphone ? "Android" : "iPhone") + " führt.") + "</span>"
    : '<span class="sm mu">Diesen Monat gab es noch keinen Anlass. Das nächste Treffen eröffnet das Duell.</span>';
  if (vor) h += '<span class="sm b" data-test="duell-vormonat">Letzten Monat: ' + (vor.android == vor.iphone ? "unentschieden." : (vor.android > vor.iphone ? "Android gewinnt, iPhone" : "iPhone gewinnt, Android") + " bringt die nächste Magnum.") + "</span>";
  return h + "</section>";
}

  ride: function (f) { after(sb.from("rides").insert({ event_id: f.getAttribute("data-id"), driver_id: uid(), direction: v("rdDir").trim(), seats: Math.max(1, Math.min(8, +v("rdSeats", 3) || 3)) }), "Danke! Du bist als Fahrer eingetragen").then(function () { UI.rideForm = UI.rdDir = UI.rdSeats = null; render() }) },
  card: function () {

      toast("Besuch gespeichert · jetzt bewerten!"); OV = { t: "resto", id: id }; return loadAll().then(render);

};

document.addEventListener("pointerdown", function (e) { if (e.isPrimary !== false) DRUCK = Date.now() }, true);
function losgelassen() { if (!DRUCK) return; DRUCK = 0; if (NACHHER) setTimeout(render, 0) }
// Der Klick kommt nach dem Loslassen: erst danach aufgeschobenes Neuzeichnen nachholen
document.addEventListener("click", losgelassen, true);
document.addEventListener("pointercancel", losgelassen, true);
document.addEventListener("pointerup", function () { setTimeout(losgelassen, 400) }, true);
document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-a]"); if (!el || el.disabled) return;
  var f = ACT[el.getAttribute("data-a")]; if (!f) return;
  e.preventDefault(); f(el.dataset, el);
});
document.addEventListener("submit", function (e) {
  var f = e.target, s = SUBMIT[f.getAttribute("data-s")]; if (!s) return;
  e.preventDefault(); s(f);
});
document.addEventListener("input", function (e) {
  var k = e.target.getAttribute && e.target.getAttribute("data-k"); if (!k) return;
  var before = !!String(UI[k] || "").trim();
  UI[k] = e.target.type == "checkbox" ? e.target.checked : e.target.value;
  // Knöpfe freischalten, sobald etwas eingegeben ist (ohne bei jedem Zeichen neu zu zeichnen)
  if (before != !!String(UI[k] || "").trim() || e.target.tagName == "SELECT") render();
});
document.addEventListener("change", function (e) {
  var el = e.target, c = el.getAttribute && el.getAttribute("data-c");
  if (c && CHANGE[c]) { CHANGE[c](el); return }
  var k = el.getAttribute && el.getAttribute("data-k");
  if (k && (el.tagName == "SELECT" || el.type == "checkbox" || el.type == "date")) { UI[k] = el.type == "checkbox" ? el.checked : el.value; render() }
});
// Aufgeklappte Bereiche bleiben beim Neuzeichnen offen
document.addEventListener("toggle", function (e) { var k = e.target.getAttribute && e.target.getAttribute("data-offen"); if (k) UI[k] = e.target.open }, true);
document.addEventListener("keydown", function (e) { if (e.key == "Escape" && (SH || OV)) { ACT.close() } });

// ═════════════ Start ═════════════
function readInvite() {
  var m = location.hash.match(/einladung=([A-Za-z0-9_-]+)/);
  if (!m) return;
  INVITE = { token: m[1], state: "checking" };
  sb.functions.invoke("invite", { body: { action: "check", token: m[1] } }).then(function (r) {
    fnErr(r).then(function (e) { if (e) INVITE = { state: "bad", err: e }; else INVITE = { token: m[1], state: "ok", from: r.data.from }; render() });
  });
}
function start() {
  if (!C.data || !C.api || !window.magnumDb) { render(); return }
  sb = window.magnumDb.createClient(C);
  wartung().then(function (mt) { if (mt) render() });
  // Auch die Anmeldeseite merkt, wenn ein Update beginnt oder endet
  CH = sb.channel("club").on("postgres_changes", { event: "*", schema: "public" }, function (p) {
    if (p && p.table == "app_status") { var mt = !!(p.new && p.new.maintenance); if (MAINT && !mt) location.reload(); MAINT = mt; render(); return }
    if (READY) refresh();
  }).subscribe();
  readInvite();
  sb.auth.onAuthStateChange(function (ev, s) {
    if (ev == "PASSWORD_RECOVERY") { AUTH = { mode: "recovery" }; render(); return }
    var was = ME && ME.id; ME = s ? s.user : null;
    if (!ME) { READY = false; PRF = null; render(); return }
    if (was == ME.id && READY) return;
    if (INVITE && INVITE.state != "bad") { INVITE = null; history.replaceState(null, "", location.pathname + location.search) }
    READY = false; render();
    setTimeout(function () {
      sb.rpc("me").then(function (r) { PREV = r.data && r.data.prev_seen; return sb.rpc("magnum_termine") }).then(function () { return loadAll() }).then(function () { READY = true; render(); loadInvites() });
    }, 0);
  });
  render();
}
// Einladungslink in einem schon offenen Tab: nur der #-Teil ändert sich
addEventListener("hashchange", function () { if (sb && !ME && /einladung=/.test(location.hash)) { readInvite(); render() } });
if ("serviceWorker" in navigator && location.protocol == "https:") navigator.serviceWorker.register("sw.js").catch(function () {});
start();
